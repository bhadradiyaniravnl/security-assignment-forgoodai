# M0(b) spike: gVisor pod + Cilium default-deny + label-based allow, observed via Hubble.
apiVersion: v1
kind: Namespace
metadata:
  name: spike-sessions
  labels: { pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: spike-system
---
apiVersion: v1
kind: Pod
metadata:
  name: gateway
  namespace: spike-system
  labels: { app: gateway }
spec:
  containers:
  - name: web
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: other
  namespace: spike-system
  labels: { app: other }
spec:
  containers:
  - name: web
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: sandbox
  namespace: spike-sessions
  labels: { sbx/state: running }
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
  - name: agent
    image: curlimages/curl:8.11.1
    command: ["sleep", "3600"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: { drop: [ALL] }
