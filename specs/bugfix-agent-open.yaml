# Deliberately permissive variant of bugfix-agent (Claude Code may run any Bash command).
# Used by the harness so agent-side tool permissions do not mask what the PLATFORM enforces.
apiVersion: sbx/v1
kind: AgentSpec
metadata:
  name: bugfix-agent-open
  version: 1
  owners: [monalir]
  annotations:
    riskAcceptance: "harness-only: lets Phase A observe platform enforcement without agent-side tool limits (SEC-0001)"
spec:
  runtime:
    image: sbx/sandbox:dev
    runtimeClass: gvisor
    resources: { cpu: "2", memory: 4Gi }
    ttl: 30m
  model:
    allow: [claude-sonnet-5-5, claude-haiku-5-5]
    default: claude-sonnet-5-5
    small: claude-haiku-5-5
    maxTokens: 2000000
  repo:
    allow: ["demo/*"]
    access: read
  agentTools:
    allow: [Read, Edit, Write, Glob, Grep, Bash]   # DELIBERATELY PERMISSIVE: any shell command
  egress:
    allow: [paste-mock.lab-ext]
  secrets:
    - ref: anthropic/default
  detection:
    denyBurst: { count: 5, window: 60s }
  parameters:
    repo: { type: string, pattern: "^demo/[a-z0-9-]+$" }
    task: { type: string, maxLength: 4000 }
