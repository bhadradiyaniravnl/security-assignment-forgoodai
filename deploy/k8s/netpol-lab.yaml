# Lab destinations ("the internet" for the scenario): reachable only from credproxy, no egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-default-deny
  namespace: lab-ext
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lab-from-credproxy
  namespace: lab-ext
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sbx-system }
          podSelector:
            matchLabels: { app: credproxy }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 8443, protocol: TCP }
