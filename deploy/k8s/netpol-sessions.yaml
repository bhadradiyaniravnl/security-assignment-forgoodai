# L3/L4 boundary for sandboxes: deny everything, then let running sessions reach the gateway only.
# No DNS, no kube-apiserver, no other pods. Containment adds a per-session egressDeny policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sessions-default-deny
  namespace: sbx-sessions
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sessions-allow-gateway
  namespace: sbx-sessions
spec:
  endpointSelector:
    matchLabels: { sbx/state: running }
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: sbx-system
            app: gateway
      toPorts:
        # AI gateway: through Cilium's Envoy for L7 HTTP visibility (allow-all HTTP rule). Hubble then reports
        # every request/response per session, independent of the gateway's own log (sentinel S1).
        - ports:
            - { port: "8080", protocol: TCP }
          rules:
            http: [{}]
        # Egress proxy: L4 only. It closes the connection after each request, so one TCP connection is one
        # request (L4 counting is enough), and L7 parsing would interfere with CONNECT tunnels.
        - ports:
            - { port: "3128", protocol: TCP }
