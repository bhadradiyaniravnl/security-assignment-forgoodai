# The control plane may manage session pods and quarantine policies in sbx-sessions only.
# No cluster-wide rights, no Secrets access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbx-controller
  namespace: sbx-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-manager
  namespace: sbx-sessions
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete, patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [create, get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbx-controller-session-manager
  namespace: sbx-sessions
subjects:
  - kind: ServiceAccount
    name: sbx-controller
    namespace: sbx-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-manager
