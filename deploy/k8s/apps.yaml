# Platform services. All share sbx/services:dev and the restricted pod profile.
# Secrets: sbx-internal (service-to-service key) everywhere; credproxy-secrets ONLY in credproxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sbx-system
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: control-plane }
  template:
    metadata:
      labels: { app: control-plane }
    spec:
      nodeSelector: { sbx/pool: platform }
      serviceAccountName: sbx-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control-plane
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "sbx.control_plane.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: CP_DB, value: /data/cp.db }
            - { name: SBX_SPEC_AUTHORS, value: monalir }      # who may register specs (prototype; prod: CODEOWNERS + CI)
            - { name: SBX_SECURITY_APPROVERS, value: secops } # two-person rule: approves spec digests
            - { name: SBX_SECURITY_ADMINS, value: secops }    # may release (destroy) contained sessions
            - name: SBX_CP_KEY
              valueFrom: { secretKeyRef: { name: sbx-internal, key: cp-key } }
            - name: SBX_KEY_GATEWAY      # authenticates the gateway on internal endpoints
              valueFrom: { secretKeyRef: { name: sbx-internal, key: gateway-key } }
            - name: SBX_KEY_CREDPROXY      # authenticates the credproxy on internal endpoints
              valueFrom: { secretKeyRef: { name: sbx-internal, key: credproxy-key } }
            - name: SBX_KEY_SENTINEL      # authenticates the sentinel on internal endpoints
              valueFrom: { secretKeyRef: { name: sbx-internal, key: sentinel-key } }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: evidence, mountPath: /evidence }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: cp-data }
        - name: tmp
          emptyDir: {}
        - name: evidence
          persistentVolumeClaim: { claimName: evidence }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sbx-system
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations: { kubectl.kubernetes.io/default-container: gateway }
    spec:
      nodeSelector: { sbx/pool: platform }
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          resources: { requests: { cpu: 250m, memory: 256Mi }, limits: { cpu: "2", memory: 1Gi } }
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "sbx.gateway.main"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - name: SBX_INTERNAL_KEY      # its own key only
              valueFrom: { secretKeyRef: { name: sbx-internal, key: gateway-key } }
          ports:
            - { containerPort: 8080 }
            - { containerPort: 3128 }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: evidence, mountPath: /evidence }
        - name: evidence-shipper                          # pushes hash-chained evidence to the sentinel
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "sbx.sentinel.shipper"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - name: SENTINEL_INGEST_KEY
              valueFrom: { secretKeyRef: { name: sbx-internal, key: ingest-key } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: evidence, mountPath: /evidence, readOnly: true }
      volumes:
        - name: evidence
          persistentVolumeClaim: { claimName: evidence }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credproxy
  namespace: sbx-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: credproxy }
  template:
    metadata:
      labels: { app: credproxy }
    spec:
      nodeSelector: { sbx/pool: platform }
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: credproxy
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "sbx.credproxy.app"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - name: SBX_INTERNAL_KEY      # its own key (policy lookups)
              valueFrom: { secretKeyRef: { name: sbx-internal, key: credproxy-key } }
            - name: SBX_KEY_GATEWAY       # the only caller allowed to use inference/egress
              valueFrom: { secretKeyRef: { name: sbx-internal, key: gateway-key } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: credproxy-secrets, key: ANTHROPIC_API_KEY } }
            - name: ANTHROPIC_WORKSPACE_ID
              valueFrom: { secretKeyRef: { name: credproxy-secrets, key: ANTHROPIC_WORKSPACE_ID, optional: true } }
            - name: GITHUB_APP_ID
              valueFrom: { secretKeyRef: { name: credproxy-secrets, key: GITHUB_APP_ID, optional: true } }
            - name: SBX_CP_KEY          # GitHub operations: control plane only (the gateway never has this key)
              valueFrom: { secretKeyRef: { name: sbx-internal, key: cp-key } }
            - { name: HOME, value: /tmp }
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          readinessProbe: { httpGet: { path: /healthz, port: 9000 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: github-app, mountPath: /secrets/github, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: github-app
          secret: { secretName: github-app, optional: true, defaultMode: 0440 }   # group-readable via fsGroup
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: sbx-system
spec:
  type: NodePort
  selector: { app: control-plane }
  ports:
    - { name: http, port: 8000, targetPort: 8000, nodePort: 30443 }
---
# Fixed ClusterIP: injected into sandboxes via hostAliases so they need no DNS.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sbx-system
spec:
  clusterIP: 10.96.100.10
  selector: { app: gateway }
  ports:
    - { name: ai, port: 8080, targetPort: 8080 }
    - { name: egress, port: 3128, targetPort: 3128 }
---
apiVersion: v1
kind: Service
metadata:
  name: credproxy
  namespace: sbx-system
spec:
  selector: { app: credproxy }
  ports:
    - { name: http, port: 9000, targetPort: 9000 }
    - { name: tunnel, port: 9001, targetPort: 9001 }
