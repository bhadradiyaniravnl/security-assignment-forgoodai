# Platform services. All share sbx/services:dev and the restricted pod profile.
# Secrets: sbx-internal (service-to-service key) everywhere; credproxy-secrets ONLY in credproxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: sbx-system
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: control-plane }
  template:
    metadata:
      labels: { app: control-plane }
    spec:
      serviceAccountName: sbx-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: control-plane
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "sbx.control_plane.app:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: CP_DB, value: /data/cp.db }
            - name: SBX_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: sbx-internal, key: key } }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: evidence, mountPath: /evidence }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: evidence
          persistentVolumeClaim: { claimName: evidence }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sbx-system
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "sbx.gateway.main"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - name: SBX_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: sbx-internal, key: key } }
          ports:
            - { containerPort: 8080 }
            - { containerPort: 3128 }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: evidence, mountPath: /evidence }
      volumes:
        - name: evidence
          persistentVolumeClaim: { claimName: evidence }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credproxy
  namespace: sbx-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: credproxy }
  template:
    metadata:
      labels: { app: credproxy }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: credproxy
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "sbx.credproxy.app"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - name: SBX_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: sbx-internal, key: key } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: credproxy-secrets, key: ANTHROPIC_API_KEY } }
            - name: ANTHROPIC_WORKSPACE_ID
              valueFrom: { secretKeyRef: { name: credproxy-secrets, key: ANTHROPIC_WORKSPACE_ID, optional: true } }
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          readinessProbe: { httpGet: { path: /healthz, port: 9000 }, periodSeconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: sbx-system
spec:
  type: NodePort
  selector: { app: control-plane }
  ports:
    - { name: http, port: 8000, targetPort: 8000, nodePort: 30443 }
---
# Fixed ClusterIP: injected into sandboxes via hostAliases so they need no DNS.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sbx-system
spec:
  clusterIP: 10.96.100.10
  selector: { app: gateway }
  ports:
    - { name: ai, port: 8080, targetPort: 8080 }
    - { name: egress, port: 3128, targetPort: 3128 }
---
apiVersion: v1
kind: Service
metadata:
  name: credproxy
  namespace: sbx-system
spec:
  selector: { app: credproxy }
  ports:
    - { name: http, port: 9000, targetPort: 9000 }
    - { name: tunnel, port: 9001, targetPort: 9001 }
---
# detector: reads evidence read-only and Hubble flows; acts only through the control plane.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
  namespace: sbx-system
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: detector }
  template:
    metadata:
      labels: { app: detector }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: detector
          image: sbx/services:dev
          imagePullPolicy: Never
          command: ["python", "-m", "sbx.detector.main"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: HOME, value: /tmp }
            - name: SBX_INTERNAL_KEY
              valueFrom: { secretKeyRef: { name: sbx-internal, key: key } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: evidence, mountPath: /evidence, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: evidence
          persistentVolumeClaim: { claimName: evidence, readOnly: true }
        - name: tmp
          emptyDir: {}
